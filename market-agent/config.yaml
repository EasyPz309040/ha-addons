name: "EasyPz Market Agent"
version: "1.10.0"
slug: "market-agent"
description: "Live view of the Workflow Service's Market Agent loop: price chart, recent ticks, and an on-demand real analysis run, with push notifications when the movement threshold is met."
url: "https://github.com/EasyPz309040/ha-addons/tree/main/market-agent"
arch:
  - amd64
  - aarch64
startup: application
ingress: true
ingress_port: 8099
panel_icon: mdi:chart-line
panel_title: Market Agent
boot: auto
init: false
homeassistant_api: true
map:
  - share:rw
options:
  workflow_service_host: "192.168.0.201"
  market_agent_symbol: "XAGUSD"
  notify_service: ""
  saxo_login_url: ""
schema:
  workflow_service_host: str
  market_agent_symbol: str
  notify_service: str
  saxo_login_url: str
