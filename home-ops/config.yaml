name: "EasyPz Home Ops"
version: "2.0.0"
slug: "home-ops"
description: "Home fleet control panel: scheduled Ansible OS updates and k3s backups (playbooks pulled from a private git repo), plus a live Market Agent view fed from xWeb."
url: "https://github.com/EasyPz309040/ha-addons/tree/main/home-ops"
arch:
  - amd64
  - aarch64
startup: application
ingress: true
ingress_port: 8099
panel_icon: mdi:rocket-launch-outline
panel_title: Home Ops
boot: auto
init: false
homeassistant_api: true
map:
  - share:rw
options:
  playbook_repo: "git@github.com:EasyPz309040/Home.git"
  playbook_branch: "main"
  playbook_subdir: "ANSIBLE"
  update_schedule: "0 3 * * 0"
  update_playbook: "cluster-update.yml"
  backup_schedule: "0 2 * * *"
  backup_enabled: true
  sync_before_run: true
  run_on_start: false
  xweb_host: "192.168.0.201"
  market_agent_symbol: "XAGUSD"
  notify_service: ""
schema:
  playbook_repo: str
  playbook_branch: str
  playbook_subdir: str
  update_schedule: "match(^\\S+\\s+\\S+\\s+\\S+\\s+\\S+\\s+\\S+$)"
  update_playbook: str
  backup_schedule: "match(^\\S+\\s+\\S+\\s+\\S+\\s+\\S+\\s+\\S+$)"
  backup_enabled: bool
  sync_before_run: bool
  run_on_start: bool
  xweb_host: str
  market_agent_symbol: str
  notify_service: str
